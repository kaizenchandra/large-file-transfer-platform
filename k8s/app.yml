# Provision managed PostgreSQL, Redis and a private S3 bucket separately.
# Create Secret drive-config with DATABASE_URL, DATABASE_USER, DATABASE_PASSWORD,
# OIDC_ISSUER, OIDC_AUDIENCE, S3_ENDPOINT, S3_PUBLIC_ENDPOINT, S3_BUCKET, AWS_REGION.
# Also configure SCAN_MODE=REQUIRED, CLAMAV_HOST, CLAMAV_PORT, SCAN_MAX_BYTES, SCAN_POLICY.
# Provision a private ClamD service with current signatures and a policy matching docker/clamd.conf.
# Use workload identity for AWS credentials. Image must be built and pushed first.
apiVersion: apps/v1
kind: Deployment
metadata: { name: drive }
spec:
  replicas: 3
  selector: { matchLabels: { app: drive } }
  template:
    metadata: { labels: { app: drive } }
    spec:
      terminationGracePeriodSeconds: 45
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: api
          image: drive:1.0.0
          ports: [ { containerPort: 8080 } ]
          envFrom: [ { secretRef: { name: drive-config } } ]
          resources:
            requests: { cpu: 500m, memory: 768Mi }
            limits: { cpu: '2', memory: 1536Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ ALL ] } }
          volumeMounts: [ { name: tmp, mountPath: /tmp } ]
          startupProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, failureThreshold: 30, periodSeconds: 5 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, periodSeconds: 10 }
      volumes: [ { name: tmp, emptyDir: { } } ]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector: { matchLabels: { app: drive } }
---
apiVersion: v1
kind: Service
metadata: { name: drive }
spec:
  selector: { app: drive }
  ports: [ { port: 80, targetPort: 8080 } ]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: drive }
spec:
  minAvailable: 2
  selector: { matchLabels: { app: drive } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: drive }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: drive }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
