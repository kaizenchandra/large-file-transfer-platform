# Override storage for the measured large-file profile; build the pinned source image first.
services:
  minio-large:
    build: ./infrastructure/minio
    image: harbor-minio:2025-09-07
    mem_limit: 2g
    cpus: 2
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3011,http://localhost:3012
    command: ['server', '/data', '--address', ':9000']
    ports: ['127.0.0.1:39000:9000']
